<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>MAKTAB</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    transform:translate(-50%,-50%);
    background:white;
    border-radius:50%;
    opacity:.8;
    pointer-events:none;
    z-index:10;
}

/* =========================
   INTERACTION TEXT
========================= */

#interaction{
    position:fixed;
    left:50%;
    bottom:18%;
    transform:translateX(-50%);
    color:white;
    font-size:14px;
    padding:8px 13px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.15);
    border-radius:6px;
    display:none;
    z-index:20;
    pointer-events:none;
}

/* =========================
   MOBILE UI
========================= */

#mobileUI{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
}

/* Joystick */

#joystick{
    position:absolute;
    left:22px;
    bottom:25px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:52px;
    height:52px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.3);
}

/* Buttons */

.mobileButton{
    position:absolute;
    width:54px;
    height:54px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.10);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    pointer-events:auto;
    user-select:none;
}

#flashButton{
    right:25px;
    bottom:28px;
}

#interactButton{
    right:91px;
    bottom:28px;
}

#fullscreenButton{
    right:20px;
    top:20px;
    width:42px;
    height:42px;
    font-size:17px;
}

/* Landscape */

@media (pointer:coarse){

    #mobileUI{
        display:block;
    }

    #interaction{
        bottom:23%;
    }
}

/* Portrait warning */

#portraitWarning{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#050505;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-size:18px;
}

@media (orientation:portrait) and (pointer:coarse){
    #portraitWarning{
        display:flex;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="crosshair"></div>

<div id="interaction">E — ochish</div>

<div id="mobileUI">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="interactButton" class="mobileButton">
        E
    </div>

    <div id="flashButton" class="mobileButton">
        🔦
    </div>

    <div id="fullscreenButton" class="mobileButton">
        ⛶
    </div>

</div>

<div id="portraitWarning">
    <div>
        📱<br><br>
        Iltimos, telefonni<br>
        <b>gorizontal holatga</b> aylantiring.
    </div>
</div>


<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


/* =========================================================
   BASIC SETUP
========================================================= */

const game = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020202);

scene.fog = new THREE.Fog(
    0x020202,
    5,
    42
);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.05,
    100
);

camera.position.set(
    0,
    1.65,
    8
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"low-power"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.25)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

game.appendChild(renderer.domElement);


/* =========================================================
   LIGHT
========================================================= */

const ambient = new THREE.HemisphereLight(
    0x555555,
    0x111111,
    0.45
);

scene.add(ambient);


/* =========================================================
   FLOOR
========================================================= */

const floorMaterial =
new THREE.MeshStandardMaterial({
    color:0x242424,
    roughness:1
});

const floor =
new THREE.Mesh(
    new THREE.BoxGeometry(
        8,0.2,50
    ),
    floorMaterial
);

floor.position.y = -0.1;

scene.add(floor);


/* =========================================================
   CEILING
========================================================= */

const ceiling =
new THREE.Mesh(
    new THREE.BoxGeometry(
        8,0.2,50
    ),
    new THREE.MeshStandardMaterial({
        color:0x111111
    })
);

ceiling.position.y = 3.5;

scene.add(ceiling);


/* =========================================================
   WALL MATERIAL
========================================================= */

const wallMaterial =
new THREE.MeshStandardMaterial({
    color:0x303030,
    roughness:1
});


/* =========================================================
   WALL CREATOR
========================================================= */

const colliders = [];

function createWall(
    x,
    y,
    z,
    sx,
    sy,
    sz
){

    const wall =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            sx,sy,sz
        ),
        wallMaterial
    );

    wall.position.set(
        x,y,z
    );

    scene.add(wall);

    colliders.push({
        mesh:wall,
        type:"wall"
    });

    return wall;
}


/* =========================================================
   CORRIDOR WALLS
========================================================= */

createWall(
    -4,
    1.7,
    -17,
    .3,
    3.4,
    50
);

createWall(
    4,
    1.7,
    -17,
    .3,
    3.4,
    50
);


/* =========================================================
   BACK WALL
========================================================= */

createWall(
    0,
    1.7,
    -42,
    8,
    3.4,
    .3
);


/* =========================================================
   DOORS
========================================================= */

function createDoor(
    x,
    z,
    name
){

    const door =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.7,
            2.7,
            .18
        ),
        new THREE.MeshStandardMaterial({
            color:0x292929,
            roughness:1
        })
    );

    door.position.set(
        x,
        1.35,
        z
    );

    door.userData.interactable = true;
    door.userData.open = false;
    door.userData.name = name;

    scene.add(door);

    colliders.push({
        mesh:door,
        type:"door"
    });

    return door;
}


/* =========================================================
   DOORS
========================================================= */

const door1 =
createDoor(
    -3.82,
    2,
    "1-xona"
);

const door2 =
createDoor(
    3.82,
    -5,
    "2-xona"
);


/* =========================================================
   WINDOWS
========================================================= */

const windowMaterial =
new THREE.MeshBasicMaterial({
    color:0x10151a
});

function createWindow(
    x,
    z
){

    const w =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .08,
            1.6,
            2
        ),
        windowMaterial
    );

    w.position.set(
        x,
        1.8,
        z
    );

    scene.add(w);
}

createWindow(-3.8,-11);
createWindow(-3.8,-17);
createWindow(-3.8,-23);

createWindow(3.8,-13);
createWindow(3.8,-19);
createWindow(3.8,-25);


/* =========================================================
   DESKS
========================================================= */

function createDesk(
    x,
    z
){

    const group =
    new THREE.Group();

    const top =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.2,
            .12,
            .65
        ),
        new THREE.MeshStandardMaterial({
            color:0x3a3027
        })
    );

    top.position.y = .9;

    group.add(top);

    const legMaterial =
    new THREE.MeshStandardMaterial({
        color:0x292929
    });

    const positions = [
        [-.45,.45,-.22],
        [.45,.45,-.22],
        [-.45,.45,.22],
        [.45,.45,.22]
    ];

    for(const p of positions){

        const leg =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .08,
                .9,
                .08
            ),
            legMaterial
        );

        leg.position.set(
            p[0],
            p[1],
            p[2]
        );

        group.add(leg);
    }

    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    colliders.push({
        mesh:group,
        type:"obstacle"
    });
}

createDesk(-1.8,-8);
createDesk(1.7,-11);
createDesk(-1.6,-15);
createDesk(1.6,-18);


/* =========================================================
   FLASHLIGHT
========================================================= */

const flashlight =
new THREE.SpotLight(
    0xffffff,
    2.2,
    25,
    Math.PI/7,
    .5,
    1
);

flashlight.position.set(
    0,
    0,
    0
);

camera.add(flashlight);

scene.add(camera);

let flashlightOn = true;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    height:1.65,

    radius:.32,

    speed:3.0,

    position:camera.position

};


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e=>{
        keys[e.code] = true;

        if(e.code === "KeyF"){
            toggleFlashlight();
        }

        if(e.code === "KeyE"){
            interact();
        }
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.code] = false;
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

let yaw = 0;
let pitch = 0;

let mouseLocked = false;

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(window.matchMedia(
            "(pointer:fine)"
        ).matches){

            renderer.domElement.requestPointerLock();
        }
    }
);

document.addEventListener(
    "pointerlockchange",
    ()=>{

        mouseLocked =
        document.pointerLockElement ===
        renderer.domElement;

    }
);

document.addEventListener(
    "mousemove",
    e=>{

        if(!mouseLocked) return;

        yaw -= e.movementX * .0022;

        pitch -= e.movementY * .0022;

        pitch = THREE.MathUtils.clamp(
            pitch,
            -1.45,
            1.45
        );

    }
);


/* =========================================================
   MOBILE LOOK
========================================================= */

let lookTouch = null;
let lastLookX = 0;
let lastLookY = 0;

renderer.domElement.addEventListener(
    "touchstart",
    e=>{

        for(const t of e.changedTouches){

            if(t.clientX >
               innerWidth * .42){

                lookTouch = t.identifier;

                lastLookX = t.clientX;
                lastLookY = t.clientY;

            }

        }

    },
    {passive:false}
);

renderer.domElement.addEventListener(
    "touchmove",
    e=>{

        if(lookTouch === null) return;

        for(const t of e.changedTouches){

            if(t.identifier === lookTouch){

                const dx =
                t.clientX - lastLookX;

                const dy =
                t.clientY - lastLookY;

                yaw -= dx * .004;

                pitch -= dy * .004;

                pitch =
                THREE.MathUtils.clamp(
                    pitch,
                    -1.45,
                    1.45
                );

                lastLookX = t.clientX;
                lastLookY = t.clientY;
            }
        }

    },
    {passive:false}
);

renderer.domElement.addEventListener(
    "touchend",
    e=>{

        for(const t of e.changedTouches){

            if(t.identifier === lookTouch){
                lookTouch = null;
            }

        }

    },
    {passive:false}
);


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
document.getElementById("joystick");

const stick =
document.getElementById("stick");

let joyX = 0;
let joyY = 0;

let joystickActive = false;

function updateJoystick(
    clientX,
    clientY
){

    const rect =
    joystick.getBoundingClientRect();

    const centerX =
    rect.left + rect.width/2;

    const centerY =
    rect.top + rect.height/2;

    let dx =
    clientX - centerX;

    let dy =
    clientY - centerY;

    const max =
    rect.width/2 - 26;

    const distance =
    Math.sqrt(
        dx*dx + dy*dy
    );

    if(distance > max){

        dx =
        dx / distance * max;

        dy =
        dy / distance * max;

    }

    joyX = dx / max;

    joyY = dy / max;

    stick.style.transform =
    `translate(calc(-50% + ${dx}px),
               calc(-50% + ${dy}px))`;
}

function resetJoystick(){

    joystickActive = false;

    joyX = 0;
    joyY = 0;

    stick.style.transform =
    "translate(-50%,-50%)";
}

joystick.addEventListener(
    "pointerdown",
    e=>{

        joystickActive = true;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );

    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(!joystickActive) return;

        updateJoystick(
            e.clientX,
            e.clientY
        );

    }
);

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


/* =========================================================
   MOVEMENT + COLLISION
========================================================= */

const playerBox =
new THREE.Box3();

const tempBox =
new THREE.Box3();

function canMoveTo(
    x,
    z
){

    const r =
    player.radius;

    playerBox.min.set(
        x-r,
        0.2,
        z-r
    );

    playerBox.max.set(
        x+r,
        2.1,
        z+r
    );

    for(const c of colliders){

        if(!c.mesh.visible)
            continue;

        tempBox.setFromObject(
            c.mesh
        );

        if(
            playerBox.intersectsBox(
                tempBox
            )
        ){
            return false;
        }
    }

    return true;
}


/* =========================================================
   MOVEMENT
========================================================= */

const direction =
new THREE.Vector3();

const forward =
new THREE.Vector3();

const right =
new THREE.Vector3();

function updateMovement(
    delta
){

    let moveForward = 0;
    let moveSide = 0;

    /* Keyboard */

    if(keys["KeyW"] ||
       keys["ArrowUp"]){

        moveForward += 1;
    }

    if(keys["KeyS"] ||
       keys["ArrowDown"]){

        moveForward -= 1;
    }

    if(keys["KeyA"] ||
       keys["ArrowLeft"]){

        moveSide -= 1;
    }

    if(keys["KeyD"] ||
       keys["ArrowRight"]){

        moveSide += 1;
    }

    /* Mobile */

    if(Math.abs(joyY) > .05){

        moveForward += -joyY;
    }

    if(Math.abs(joyX) > .05){

        moveSide += joyX;
    }

    if(
        moveForward === 0 &&
        moveSide === 0
    ){
        return;
    }

    const length =
    Math.sqrt(
        moveForward*moveForward +
        moveSide*moveSide
    );

    moveForward /= length;
    moveSide /= length;


    /* Camera directions */

    forward.set(
        -Math.sin(yaw),
        0,
        -Math.cos(yaw)
    );

    right.set(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
    );

    direction
        .set(0,0,0)
        .addScaledVector(
            forward,
            moveForward
        )
        .addScaledVector(
            right,
            moveSide
        );


    const distance =
    player.speed * delta;

    const nextX =
    camera.position.x +
    direction.x * distance;

    const nextZ =
    camera.position.z +
    direction.z * distance;


    /* X */

    if(
        canMoveTo(
            nextX,
            camera.position.z
        )
    ){

        camera.position.x =
        nextX;
    }


    /* Z */

    if(
        canMoveTo(
            camera.position.x,
            nextZ
        )
    ){

        camera.position.z =
        nextZ;
    }
}


/* =========================================================
   CAMERA ROTATION
========================================================= */

function updateCamera(){

    camera.rotation.order =
    "YXZ";

    camera.rotation.y =
    yaw;

    camera.rotation.x =
    pitch;
}


/* =========================================================
   INTERACTION
========================================================= */

const raycaster =
new THREE.Raycaster();

const interaction =
document.getElementById(
    "interaction"
);

let currentDoor = null;

function checkInteraction(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const objects =
    colliders
        .filter(c =>
            c.type === "door"
        )
        .map(c => c.mesh);

    const hits =
    raycaster.intersectObjects(
        objects,
        false
    );

    currentDoor = null;

    if(
        hits.length &&
        hits[0].distance < 3
    ){

        currentDoor =
        hits[0].object;

        interaction.style.display =
        "block";

        interaction.textContent =
        currentDoor.userData.open
        ? "E — yopish"
        : "E — ochish";

    }
    else{

        interaction.style.display =
        "none";
    }
}


/* =========================================================
   DOOR INTERACTION
========================================================= */

function interact(){

    if(!currentDoor)
        return;

    const door =
    currentDoor;

    if(
        door.userData.open
    ){

        door.userData.open =
        false;

        door.rotation.y = 0;

    }
    else{

        door.userData.open =
        true;

        door.rotation.y =
        -Math.PI/2;

    }
}


/* =========================================================
   FLASHLIGHT
========================================================= */

function toggleFlashlight(){

    flashlightOn =
    !flashlightOn;

    flashlight.visible =
    flashlightOn;
}


/* =========================================================
   MOBILE BUTTONS
========================================================= */

document
.getElementById("flashButton")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        toggleFlashlight();
    }
);

document
.getElementById("interactButton")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        interact();
    }
);


/* =========================================================
   FULLSCREEN + LANDSCAPE
========================================================= */

async function enterGameMode(){

    try{

        if(
            !document.fullscreenElement
        ){

            await document
                .documentElement
                .requestFullscreen();

        }

    }catch(e){}

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }catch(e){}

}


/* Fullscreen button */

document
.getElementById("fullscreenButton")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        enterGameMode();

    }
);


/* First touch */

window.addEventListener(
    "touchstart",
    ()=>{
        enterGameMode();
    },
    {
        once:true,
        passive:true
    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
        innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight,
            false
        );

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
    Math.min(
        clock.getDelta(),
        .05
    );

    updateMovement(
        delta
    );

    updateCamera();

    checkInteraction();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   MOBILE START
========================================================= */

if(
    window.matchMedia(
        "(pointer:coarse)"
    ).matches
){

    enterGameMode();

}

</script>

</body>
</html>
