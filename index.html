<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>MAKTAB</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #game {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* =========================
           LOADING
        ========================= */

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: #ddd;
            font-size: 18px;
            z-index: 100;
        }

        /* =========================
           ERROR
        ========================= */

        #error {
            position: fixed;
            left: 20px;
            right: 20px;
            top: 20px;
            padding: 15px;
            background: #250000;
            color: #fff;
            border: 1px solid #660000;
            z-index: 200;
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================
           CROSSHAIR
        ========================= */

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 8px;
            height: 8px;
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
        }

        #crosshair::before {
            width: 8px;
            height: 1px;
            left: 0;
            top: 3px;
        }

        #crosshair::after {
            width: 1px;
            height: 8px;
            left: 3px;
            top: 0;
        }

        /* =========================
           MOBILE UI
        ========================= */

        #mobile-ui {
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            display: none;
        }

        .mobile-button {
            position: absolute;
            width: 58px;
            height: 58px;
            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.28);

            background: rgba(20,20,20,0.28);

            color: rgba(255,255,255,0.9);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;

            backdrop-filter: blur(4px);

            -webkit-backdrop-filter: blur(4px);

            pointer-events: auto;

            touch-action: none;
        }

        .mobile-button:active {
            background: rgba(255,255,255,0.18);
            transform: scale(0.94);
        }

        #flashlight-button {
            right: 24px;
            bottom: 120px;
        }

        #interact-button {
            right: 92px;
            bottom: 58px;
        }

        #fullscreen-button {
            right: 24px;
            top: 24px;
        }

        /* =========================
           JOYSTICK
        ========================= */

        #joystick-area {
            position: absolute;

            left: 20px;
            bottom: 25px;

            width: 145px;
            height: 145px;

            pointer-events: auto;

            touch-action: none;
        }

        #joystick-base {
            position: absolute;

            left: 15px;
            top: 15px;

            width: 115px;
            height: 115px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.22);

            background: rgba(20,20,20,0.20);

            backdrop-filter: blur(4px);

            -webkit-backdrop-filter: blur(4px);
        }

        #joystick-knob {
            position: absolute;

            left: 43px;
            top: 43px;

            width: 58px;
            height: 58px;

            border-radius: 50%;

            background: rgba(255,255,255,0.16);

            border: 1px solid rgba(255,255,255,0.35);

            pointer-events: none;
        }

        /* =========================
           MOBILE ONLY
        ========================= */

        @media (pointer: coarse) {

            #mobile-ui {
                display: block;
            }

        }

        @media (pointer: fine) {

            #mobile-ui {
                display: none;
            }

        }

    </style>
</head>

<body>

<canvas id="game"></canvas>

<div id="loading">
    MAKTAB yuklanmoqda...
</div>

<div id="error"></div>

<div id="crosshair"></div>

<!-- =========================
     MOBILE CONTROLS
========================= -->

<div id="mobile-ui">

    <div id="joystick-area">
        <div id="joystick-base"></div>
        <div id="joystick-knob"></div>
    </div>

    <button
        id="flashlight-button"
        class="mobile-button"
        type="button"
        aria-label="Flashlight"
    >
        🔦
    </button>

    <button
        id="interact-button"
        class="mobile-button"
        type="button"
        aria-label="Interact"
    >
        E
    </button>

    <button
        id="fullscreen-button"
        class="mobile-button"
        type="button"
        aria-label="Fullscreen"
    >
        ⛶
    </button>

</div>


<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ============================================================
// DOM
// ============================================================

const canvas =
    document.getElementById("game");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const flashlightButton =
    document.getElementById("flashlight-button");

const interactButton =
    document.getElementById("interact-button");

const fullscreenButton =
    document.getElementById("fullscreen-button");

const joystickArea =
    document.getElementById("joystick-area");

const joystickKnob =
    document.getElementById("joystick-knob");


// ============================================================
// THREE.JS
// ============================================================

let scene;
let camera;
let renderer;
let clock;


// ============================================================
// PLAYER
// ============================================================

const player =
    new THREE.Vector3(
        0,
        1.7,
        8
    );

let yaw = 0;
let pitch = 0;

const keys = {};


// ============================================================
// SETTINGS
// ============================================================

const SETTINGS = {

    moveSpeed: 3.2,

    mouseSensitivity: 0.0022,

    touchSensitivity: 0.004,

    maxPixelRatio: 1.5,

    playerHeight: 1.7,

    corridorMinX: -3.55,

    corridorMaxX: 3.55,

    corridorMinZ: -40.2,

    corridorMaxZ: 7.6

};


// ============================================================
// MOBILE INPUT
// ============================================================

let joystickX = 0;
let joystickY = 0;

let joystickPointerId = null;

let lookPointerId = null;

let lookLastX = 0;
let lookLastY = 0;


// ============================================================
// FLASHLIGHT
// ============================================================

let flashlightOn = false;

let flashlight;


// ============================================================
// INIT
// ============================================================

function init() {

    try {

        // ====================================================
        // SCENE
        // ====================================================

        scene =
            new THREE.Scene();

        scene.background =
            new THREE.Color(
                0x08090b
            );

        scene.fog =
            new THREE.Fog(
                0x08090b,
                8,
                45
            );


        // ====================================================
        // CAMERA
        // ====================================================

        camera =
            new THREE.PerspectiveCamera(
                70,
                window.innerWidth /
                window.innerHeight,
                0.05,
                100
            );

        camera.position.copy(player);


        // ====================================================
        // RENDERER
        // ====================================================

        renderer =
            new THREE.WebGLRenderer({

                canvas,

                antialias: false,

                powerPreference:
                    "low-power"

            });

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                SETTINGS.maxPixelRatio
            )
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.outputColorSpace =
            THREE.SRGBColorSpace;


        // ====================================================
        // LIGHTING
        // ====================================================

        const ambient =
            new THREE.HemisphereLight(
                0x7d8795,
                0x151515,
                1.15
            );

        scene.add(ambient);


        createCeilingLight(
            0,
            2
        );

        createCeilingLight(
            0,
            -6
        );

        createCeilingLight(
            0,
            -14
        );

        createCeilingLight(
            0,
            -22
        );

        createCeilingLight(
            0,
            -30
        );


        // ====================================================
        // MATERIALS
        // ====================================================

        const floorMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x4a4a47,
                roughness: 0.92
            });


        const wallMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x77736d,
                roughness: 0.96
            });


        const ceilingMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x62625e,
                roughness: 1
            });


        const doorMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x3d3029,
                roughness: 0.92
            });


        // ====================================================
        // FLOOR
        // ====================================================

        createBox(
            8,
            0.15,
            50,
            0,
            -0.075,
            -16,
            floorMaterial
        );


        // ====================================================
        // CEILING
        // ====================================================

        createBox(
            8,
            0.15,
            50,
            0,
            3.7,
            -16,
            ceilingMaterial
        );


        // ====================================================
        // WALLS
        // ====================================================

        createBox(
            0.25,
            3.7,
            50,
            -4,
            1.85,
            -16,
            wallMaterial
        );

        createBox(
            0.25,
            3.7,
            50,
            4,
            1.85,
            -16,
            wallMaterial
        );

        createBox(
            8,
            3.7,
            0.25,
            0,
            1.85,
            -41,
            wallMaterial
        );


        // ====================================================
        // DOORS
        // ====================================================

        createDoor(
            -3.82,
            -3,
            doorMaterial
        );

        createDoor(
            3.82,
            -9,
            doorMaterial
        );

        createDoor(
            -3.82,
            -16,
            doorMaterial
        );

        createDoor(
            3.82,
            -24,
            doorMaterial
        );

        createDoor(
            -3.82,
            -31,
            doorMaterial
        );


        // ====================================================
        // WINDOWS
        // ====================================================

        createWindow(
            -3.82,
            -6
        );

        createWindow(
            -3.82,
            -12
        );

        createWindow(
            -3.82,
            -21
        );

        createWindow(
            -3.82,
            -28
        );


        // ====================================================
        // DESKS
        // ====================================================

        createDesk(
            -2.2,
            -7
        );

        createDesk(
            2.2,
            -13
        );

        createDesk(
            -2.2,
            -20
        );

        createDesk(
            2.2,
            -27
        );


        // ====================================================
        // FLASHLIGHT
        // ====================================================

        flashlight =
            new THREE.SpotLight(
                0xffffff,
                0,
                18,
                Math.PI / 7,
                0.55,
                1.4
            );

        flashlight.position.set(
            0,
            0,
            0
        );

        flashlight.target.position.set(
            0,
            0,
            -5
        );

        camera.add(
            flashlight
        );

        camera.add(
            flashlight.target
        );

        scene.add(camera);


        // ====================================================
        // INPUT
        // ====================================================

        setupKeyboard();

        setupMouse();

        setupMobileControls();


        // ====================================================
        // RESIZE
        // ====================================================

        window.addEventListener(
            "resize",
            resize
        );


        // ====================================================
        // CLOCK
        // ====================================================

        clock =
            new THREE.Clock();


        loading.style.display =
            "none";


        animate();


    } catch (error) {

        showError(error);

    }

}


// ============================================================
// BOX
// ============================================================

function createBox(
    width,
    height,
    depth,
    x,
    y,
    z,
    material
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    scene.add(mesh);

    return mesh;

}


// ============================================================
// DOOR
// ============================================================

function createDoor(
    x,
    z,
    material
) {

    createBox(
        0.15,
        2.4,
        1.4,
        x,
        1.2,
        z,
        material
    );

}


// ============================================================
// WINDOW
// ============================================================

function createWindow(
    x,
    z
) {

    const glassMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x18232b,
            roughness: 0.4
        });


    createBox(
        0.04,
        1.4,
        1.25,
        x < 0
            ? x + 0.04
            : x - 0.04,
        1.8,
        z,
        glassMaterial
    );

}


// ============================================================
// DESK
// ============================================================

function createDesk(
    x,
    z
) {

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x4a3327,
            roughness: 0.95
        });


    createBox(
        1.1,
        0.1,
        0.65,
        x,
        0.9,
        z,
        material
    );


    const legs = [
        [-0.42, -0.22],
        [0.42, -0.22],
        [-0.42, 0.22],
        [0.42, 0.22]
    ];


    for (
        const [lx, lz]
        of legs
    ) {

        createBox(
            0.08,
            0.9,
            0.08,
            x + lx,
            0.45,
            z + lz,
            material
        );

    }

}


// ============================================================
// CEILING LIGHT
// ============================================================

function createCeilingLight(
    x,
    z
) {

    const light =
        new THREE.PointLight(
            0xc8d5ff,
            5,
            11,
            2
        );

    light.position.set(
        x,
        3.3,
        z
    );

    scene.add(light);


    const lampMaterial =
        new THREE.MeshStandardMaterial({

            color: 0xd9d9d0,

            emissive: 0x777777,

            emissiveIntensity: 0.35

        });


    createBox(
        1.4,
        0.08,
        0.25,
        x,
        3.55,
        z,
        lampMaterial
    );

}


// ============================================================
// KEYBOARD
// ============================================================

function setupKeyboard() {

    window.addEventListener(
        "keydown",
        event => {

            keys[event.code] = true;


            if (
                event.code === "KeyF"
            ) {

                toggleFlashlight();

            }

            if (
                event.code === "KeyE"
            ) {

                interact();

            }

        }
    );


    window.addEventListener(
        "keyup",
        event => {

            keys[event.code] = false;

        }
    );

}


// ============================================================
// MOUSE
// ============================================================

function setupMouse() {

    canvas.addEventListener(
        "click",
        () => {

            if (
                window.matchMedia(
                    "(pointer: fine)"
                ).matches
            ) {

                canvas.requestPointerLock();

            }

        }
    );


    document.addEventListener(
        "mousemove",
        event => {

            if (
                document.pointerLockElement
                !== canvas
            ) {

                return;

            }


            yaw -=
                event.movementX *
                SETTINGS.mouseSensitivity;


            pitch -=
                event.movementY *
                SETTINGS.mouseSensitivity;


            limitPitch();

        }
    );

}


// ============================================================
// MOBILE CONTROLS
// ============================================================

function setupMobileControls() {

    // --------------------------------------------------------
    // JOYSTICK
    // --------------------------------------------------------

    joystickArea.addEventListener(
        "pointerdown",
        event => {

            joystickPointerId =
                event.pointerId;

            joystickArea.setPointerCapture(
                event.pointerId
            );

            updateJoystick(
                event
            );

        }
    );


    joystickArea.addEventListener(
        "pointermove",
        event => {

            if (
                event.pointerId !==
                joystickPointerId
            ) {

                return;

            }

            updateJoystick(
                event
            );

        }
    );


    const releaseJoystick = event => {

        if (
            event.pointerId !==
            joystickPointerId
        ) {

            return;

        }

        joystickPointerId = null;

        joystickX = 0;
        joystickY = 0;

        joystickKnob.style.transform =
            "translate(0px, 0px)";

    };


    joystickArea.addEventListener(
        "pointerup",
        releaseJoystick
    );

    joystickArea.addEventListener(
        "pointercancel",
        releaseJoystick
    );


    // --------------------------------------------------------
    // TOUCH LOOK
    // --------------------------------------------------------

    canvas.addEventListener(
        "pointerdown",
        event => {

            if (
                !window.matchMedia(
                    "(pointer: coarse)"
                ).matches
            ) {

                return;

            }


            if (
                event.clientX <
                window.innerWidth * 0.35
            ) {

                return;

            }


            lookPointerId =
                event.pointerId;

            lookLastX =
                event.clientX;

            lookLastY =
                event.clientY;

            canvas.setPointerCapture(
                event.pointerId
            );

        }
    );


    canvas.addEventListener(
        "pointermove",
        event => {

            if (
                event.pointerId !==
                lookPointerId
            ) {

                return;

            }


            const dx =
                event.clientX -
                lookLastX;

            const dy =
                event.clientY -
                lookLastY;


            lookLastX =
                event.clientX;

            lookLastY =
                event.clientY;


            yaw -=
                dx *
                SETTINGS.touchSensitivity;


            pitch -=
                dy *
                SETTINGS.touchSensitivity;


            limitPitch();

        }
    );


    const releaseLook = event => {

        if (
            event.pointerId ===
            lookPointerId
        ) {

            lookPointerId = null;

        }

    };


    canvas.addEventListener(
        "pointerup",
        releaseLook
    );

    canvas.addEventListener(
        "pointercancel",
        releaseLook
    );


    // --------------------------------------------------------
    // BUTTONS
    // --------------------------------------------------------

    flashlightButton.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            toggleFlashlight();

        }
    );


    interactButton.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            interact();

        }
    );


    fullscreenButton.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            toggleFullscreen();

        }
    );

}


// ============================================================
// JOYSTICK UPDATE
// ============================================================

function updateJoystick(
    event
) {

    const rect =
        joystickArea.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        event.clientX -
        centerX;

    let dy =
        event.clientY -
        centerY;


    const maxDistance = 48;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance >
        maxDistance
    ) {

        const ratio =
            maxDistance /
            distance;

        dx *= ratio;
        dy *= ratio;

    }


    joystickX =
        dx /
        maxDistance;


    joystickY =
        dy /
        maxDistance;


    joystickKnob.style.transform =
        `translate(${dx}px, ${dy}px)`;

}


// ============================================================
// PLAYER
// ============================================================

function updatePlayer(
    delta
) {

    const forward =
        new THREE.Vector3(
            Math.sin(yaw),
            0,
            Math.cos(yaw)
        );


    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );


    const movement =
        new THREE.Vector3();


    // PC

    if (keys["KeyW"]) {
        movement.add(forward);
    }

    if (keys["KeyS"]) {
        movement.sub(forward);
    }

    if (keys["KeyD"]) {
        movement.add(right);
    }

    if (keys["KeyA"]) {
        movement.sub(right);
    }


    // MOBILE

    if (
        Math.abs(joystickY) >
        0.01
    ) {

        movement.addScaledVector(
            forward,
            -joystickY
        );

    }


    if (
        Math.abs(joystickX) >
        0.01
    ) {

        movement.addScaledVector(
            right,
            joystickX
        );

    }


    if (
        movement.lengthSq() >
        0.0001
    ) {

        movement.normalize();

        movement.multiplyScalar(
            SETTINGS.moveSpeed *
            delta
        );

    }


    // --------------------------------------------------------
    // BASIC COLLISION
    // --------------------------------------------------------

    const nextX =
        player.x +
        movement.x;

    const nextZ =
        player.z +
        movement.z;


    if (
        nextX >
        SETTINGS.corridorMinX &&

        nextX <
        SETTINGS.corridorMaxX
    ) {

        player.x =
            nextX;

    }


    if (
        nextZ >
        SETTINGS.corridorMinZ &&

        nextZ <
        SETTINGS.corridorMaxZ
    ) {

        player.z =
            nextZ;

    }


    camera.position.copy(
        player
    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


// ============================================================
// LIMIT LOOK
// ============================================================

function limitPitch() {

    const limit =
        Math.PI / 2 -
        0.05;


    pitch =
        Math.max(
            -limit,
            Math.min(
                limit,
                pitch
            )
        );

}


// ============================================================
// FLASHLIGHT
// ============================================================

function toggleFlashlight() {

    flashlightOn =
        !flashlightOn;


    flashlight.intensity =
        flashlightOn
            ? 18
            : 0;


    flashlightButton.style.opacity =
        flashlightOn
            ? "1"
            : "0.55";

}


// ============================================================
// INTERACTION
// ============================================================

function interact() {

    console.log(
        "Interaction pressed"
    );

}


// ============================================================
// FULLSCREEN
// ============================================================

async function toggleFullscreen() {

    try {

        if (
            !document.fullscreenElement
        ) {

            await document.documentElement
                .requestFullscreen();

        } else {

            await document.exitFullscreen();

        }

    } catch (error) {

        console.log(
            "Fullscreen unavailable",
            error
        );

    }

}


// ============================================================
// RESIZE
// ============================================================

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            SETTINGS.maxPixelRatio
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


// ============================================================
// GAME LOOP
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updatePlayer(
        delta
    );


    renderer.render(
        scene,
        camera
    );

}


// ============================================================
// ERROR
// ============================================================

function showError(
    error
) {

    console.error(
        error
    );


    loading.style.display =
        "none";


    errorBox.style.display =
        "block";


    errorBox.textContent =
        "MAKTAB yuklanishida xatolik: " +
        error.message;

}

init();

</script>
